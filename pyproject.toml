[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`, `dbutils`, `display` are injected by the runtime; imports live in later cells
"notebooks/*" = ["F821", "E402", "E501", "E731"]
